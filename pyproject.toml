[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tundra"
version = "2.0.0"
description = "Declarative Minecraft server configurator, client modpack installer, and dependency resolver for the Frost ecosystem"
readme = "README.md"
authors = [{ name = "SpanishSyntax", email = "spanishsyntax@pyritelabs.cc" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "minecraft",
  "papermc",
  "purpur",
  "fabric",
  "forge",
  "modrinth",
  "mrpack",
  "server",
  "configurator",
  "frost",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tundra = "tundra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tundra*"]

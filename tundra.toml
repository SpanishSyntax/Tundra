# ==============================================================================
# TUNDRA - Declarative Minecraft Server & Client Stack Manifest
# Managed via `tundra`, `tundra-server`, and `tundra-client`
# ==============================================================================

[general]
name = "Tundra"
mc_version = "26.3"
release_url = "https://github.com/SpanishSyntax/Tundra/releases/download/v2.0.0"

# ==============================================================================
# SERVER STACK CONFIGURATION (`tundra-server`)
# Supported backends: "paper" (recommended), "purpur", "folia", "plugins-only", "fabric"
# Note: Use "plugins-only" for managed hosts like Aternos where the panel provides the jar.
# ==============================================================================

[server]
backend = "paper"
plugins = [
  "luckperms",
  "vault",
  "essentialsx",
  "essentialsx-chat",
  "essentialsx-spawn",
  "essentialsx-protect",
  "essentialsx-antibuild",
  "multiverse-core",
  "multiverse-inventories",
  "multiverse-netherportals",
  "multiverse-portals",
  "multiverse-signportals",
  "fastasyncworldedit",
  "worldguard",
  "chunky",
]

# ==============================================================================
# CLIENT STACK CONFIGURATION (`tundra-client`)
# Supported loaders: "fabric" (recommended: Sodium + Iris) or "forge" (Embeddium + Oculus)
# ==============================================================================

[client]
loader = "fabric"
loader_version = "0.19.5"
include_prism_installer = true
prism_version = "11.1.1"
mods = [
  "fabric-api",
  "sodium",
  "iris",
  "journeymap",
  "ferrite-core",
  "entityculling",
  "modmenu",
]

